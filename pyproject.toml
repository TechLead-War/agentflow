[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agenthub"
version = "0.1.0"
description = "Automated coding agents with built-in code review"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.39.0",
    "openai>=1.50.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
agenthub = "agenthub.cli:main"

[tool.setuptools.packages.find]
include = ["agenthub*"]
